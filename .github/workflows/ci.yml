# Checks what needs no build once (lint), then builds Naos and runs its self tests (examples
# included) with each preset of CMakePresets.json, on every platform and compiler supported, then
# tests the package it installs. MinGW-w64 has a job of its own, since it runs in the shell of MSYS2.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that read the sources only, the same on every platform: docs/development/testing.md#lint.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Links of the Markdown files
        run: cmake -D ROOT=. -P scripts/CheckMarkdownLinks.cmake

      - name: printf calls of src/
        run: cmake -D ROOT=. -P scripts/CheckPrintfCalls.cmake

  test:
    name: ${{ matrix.toolchain }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang, macos-clang, msvc]
        preset: [default, shared]
        include:
          - toolchain: gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - toolchain: clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - toolchain: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
          - toolchain: msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The self tests check that the JUnit XML of --naos-output is well-formed where xmllint is
      # found; macOS has it, and Ubuntu has it in libxml2-utils.
      - name: Install xmllint
        if: runner.os == 'Linux'
        run: command -v xmllint || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The package installed, used by a project with find_package(Naos <version>): tests/consumer.
      - name: Test the installed package
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          cmake -D PRESET=${{ matrix.preset }} -P scripts/TestPackage.cmake

  # GCC of MinGW-w64 in MSYS2: UCRT64 with the C library of current Windows (UCRT), MINGW64 with
  # the old one (msvcrt), whose default printf does not follow C99 (src/format.h).
  mingw:
    name: mingw ${{ matrix.msystem }} (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem: [UCRT64, MINGW64]
        preset: [default, shared]
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Test the installed package
        run: cmake -D PRESET=${{ matrix.preset }} -P scripts/TestPackage.cmake
