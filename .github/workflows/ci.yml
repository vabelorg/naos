# Builds Naos and runs its self tests (examples and documentation links included) with each
# preset of CMakePresets.json, on every platform and compiler supported, then tests the package it
# installs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.toolchain }} (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang, macos-clang, msvc]
        preset: [default, shared]
        include:
          - toolchain: gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - toolchain: clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - toolchain: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
          - toolchain: msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # The package installed, used by a project with find_package(naos <version>): tests/package.
      - name: Test the installed package
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
          fi
          # A path CMake reads on Windows too (D:/a/... rather than /d/a/...).
          build="$(pwd -W 2>/dev/null || pwd)/build"
          cmake --install build/${{ matrix.preset }} --config Debug --prefix "$build/${{ matrix.preset }}-install"
          # -Werror=dev: a warning from the installed package would show in every project using it.
          cmake -S tests/package -B "$build/${{ matrix.preset }}-package" -Werror=dev \
            -DCMAKE_PREFIX_PATH="$build/${{ matrix.preset }}-install" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build/${{ matrix.preset }}-package" --config Debug
          ctest --test-dir "$build/${{ matrix.preset }}-package" -C Debug --output-on-failure
