# Prepares a release, run by hand from the Actions tab: sets the version and closes the changelog
# with scripts/prepare-release.cmake, and opens the pull request "Release <version>".
# Merging it tags the release and publishes it (release.yml). See docs/development/release.md.
#
# Needs the secret RELEASE_TOKEN, a token that can push and open pull requests: CI does not run on
# a pull request opened with the GITHUB_TOKEN of a workflow. A dry run does without it.

name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (MAJOR.MINOR.PATCH)
        required: true
        type: string
      dry_run:
        description: Only show the changes, without opening the pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      BRANCH: release/v${{ inputs.version }}
    steps:
      - name: Check the inputs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::The secret RELEASE_TOKEN is not set (see docs/development/release.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check that the version is not released yet
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::The tag v$VERSION exists already"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::The branch $BRANCH exists already"
            exit 1
          fi

      - name: Prepare the release
        run: |
          cmake -D ROOT=. -D VERSION="$VERSION" -P scripts/prepare-release.cmake
          cmake -D ROOT=. -D VERSION="$VERSION" -D OUTPUT="$RUNNER_TEMP/notes.md" \
            -P scripts/release-notes.cmake

      - name: Summary
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo '```'
            git diff --stat
            echo '```'
            echo
            echo "### Notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "<details><summary>Diff</summary>"
            echo
            echo '```diff'
            git diff
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -a -m "Release $VERSION"
          git push origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo
            echo "Merging this pull request tags \`v$VERSION\` and publishes the release with the notes above."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "Release $VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
